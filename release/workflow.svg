<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 674" width="1520" height="674" role="img" aria-labelledby="title desc">
  <title id="title">From formula review to workbook release</title>
  <desc id="desc">The approved Git baseline and submitted Excel workbook feed a definition comparison and Excel tests. The reviewer records a decision for one fingerprint. The release owner checks the submitted bytes before publishing B to Current.xlsx. If C replaces B or a changed caller needs a test, A stays current.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#54798a"/>
    </marker>
  </defs>
  <rect width="1520" height="674" fill="white"/>
  <g fill="none" stroke="#54798a" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M680 73H833"/>
    <path d="M263 136V199"/>
    <path d="M1174 136V164H534V199"/>
    <path d="M1174 136V199"/>
    <path d="M263 326V389"/>
    <path d="M1174 326V355H534V389"/>
    <path d="M680 452H833"/>
    <path d="M346 516V574"/>
    <path d="M1174 516V574"/>
  </g>
  <g stroke="#54798a" stroke-width="4">
    <rect x="10" y="12" width="670" height="124" rx="14" fill="#ecf4f6"/>
    <rect x="840" y="12" width="670" height="124" rx="14" fill="#ecf4f6"/>
    <rect x="10" y="202" width="670" height="124" rx="14" fill="#ecf4f6"/>
    <rect x="840" y="202" width="670" height="124" rx="14" fill="#ecf4f6"/>
    <rect x="10" y="392" width="670" height="124" rx="14" fill="#e3efeb"/>
    <rect x="840" y="392" width="670" height="124" rx="14" fill="#e3efeb"/>
    <rect x="10" y="578" width="1500" height="84" rx="12" fill="#f8f2e6"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#13384a">
    <g font-weight="700" font-size="40">
      <text x="34" y="59">1   Git baseline</text><text x="864" y="59">2   Excel working copy</text>
      <text x="34" y="249">3   Compare saved names</text><text x="864" y="249">4   Test in Excel</text>
      <text x="34" y="439">5   Reviewer</text><text x="864" y="439">6   Release owner</text>
    </g>
    <g font-size="32">
      <text x="34" y="109">Formula and agreed answers</text><text x="864" y="109">Source data and worksheet formulas</text>
      <text x="34" y="299">Check definitions against Git</text><text x="864" y="299">Check results and changed callers</text>
      <text x="34" y="489">Record decision for one fingerprint</text><text x="864" y="489">Match the hash and publish B</text>
    </g>
    <text x="34" y="632" font-size="34"><tspan font-weight="700">Keep A current</tspan><tspan dx="23">if C replaces B or a changed caller still needs a test.</tspan></text>
  </g>
</svg>
